<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <title>缺交作業投影</title>
  <link rel="stylesheet" href="css/style.css?v=9">
</head>
<body class="board-page">
  <div class="board-stage" id="stage">
    <header class="board-head">
      <h1 id="boardTitle">缺交作業</h1>
      <div class="meta">
        <span id="updatedAt">載入中…</span>
        <button id="btnFull" class="btn-full" type="button">全螢幕</button>
      </div>
    </header>
    <main class="board-rows" id="rows"></main>
    <div id="emptyMsg" class="board-empty-msg" hidden>目前沒有上投影的作業</div>
    <div id="offline" class="board-offline" hidden>連線中斷</div>
  </div>

  <script src="config.js?v=9"></script>
  <script src="js/api.js?v=9"></script>
  <script src="js/board.js?v=9"></script>
  <!-- 著作權浮水印：放左下（作業名稱欄），縮小調淡，避免遮到座號卡片 -->
  <script src="js/watermark.js?v=9" data-position="bottom-left" data-offset-x="0.8vw" data-offset-y="0.8vh" data-size="0.75vw" data-opacity="0.6" defer></script>
</body>
</html>
